name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: plexu, POSTGRES_PASSWORD: plexu, POSTGRES_DB: plexu }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U plexu" --health-interval 5s --health-timeout 3s --health-retries 10
    # Três bancos no mesmo Postgres: plexu (demo), plexu_test (vitest, criado pelo setup) e plexu_e2e (Playwright).
    env:
      DATABASE_URL: postgres://plexu:plexu@localhost:5433/plexu
      E2E_DATABASE_URL: postgres://plexu:plexu@localhost:5433/plexu_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: migrações no banco do demo (plexu)
        run: pnpm db:migrate
      - name: testes (vitest, banco plexu_test)
        run: pnpm test
      - run: pnpm build
      # E2E: caso de aceitação do MVP sobre o seed demo, no banco plexu_e2e (servidor next dev iniciado pelo Playwright)
      - name: banco do e2e (plexu_e2e)
        run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          APP_SECRET: segredo-de-ci-com-mais-de-16-caracteres
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
