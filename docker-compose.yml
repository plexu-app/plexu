services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plexu
      POSTGRES_PASSWORD: plexu
      POSTGRES_DB: plexu
    ports: ["5433:5432"]   # 5433 no host para não colidir com Postgres local
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexu"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://plexu:plexu@db:5432/plexu
      APP_URL: http://localhost:3000
      APP_SECRET: ${APP_SECRET:-}   # obrigatório: defina no .env (16+ caracteres aleatórios)
    ports: ["3000:3000"]
    command: sh -c "node scripts/migrate.mjs && node server.js"

  worker:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://plexu:plexu@db:5432/plexu
    command: node scripts/worker.mjs

volumes:
  pgdata:
